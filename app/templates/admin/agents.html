{% extends "base_v3.html" %}
{% block content %}
<div style="padding-top:90px"></div>
<div class="wrap">
  <div class="section-label">9 Agents IA — Automation</div>
  <h1 class="sec-title">Agents IA<br>— Dashboard</h1>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-top:24px">
    {% for a in agents %}
    <div style="background:#fff;padding:20px">
      <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:12px"><b>{{ a.name }}</b><span style="font-size:10px;padding:4px 8px;border-radius:999px;background:#f5f5f5">{{ a.status }}</span></div>
      <div style="font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--terra);margin-bottom:8px">{{ a.role }}</div>
      <div style="font-size:13px;color:#666;line-height:1.5;margin-bottom:16px">{{ a.desc }}</div>
      <button onclick="runAgent('{{ a.id }}')" class="btn light" style="font-size:10px;padding:8px 12px">Run daily →</button>
      <div id="result-{{ a.id }}" style="margin-top:12px;font-size:11px;background:#FFFBF5;padding:10px;border:1px solid var(--line);display:none"></div>
    </div>
    {% endfor %}
  </div>
</div>
<script>
function runAgent(id){
  const el=document.getElementById('result-'+id);
  el.style.display='block'; el.textContent='⏳ Running...';
  fetch('/admin/api/agents/'+id+'/run').then(r=>r.json()).then(d=>{
    el.textContent=JSON.stringify(d,null,2).slice(0,2000);
  }).catch(e=>el.textContent='Error '+e);
}
</script>
{% endblock %}
